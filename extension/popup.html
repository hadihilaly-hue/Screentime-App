<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EarnedTime</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; width: 18rem; }
      h1 { font-size: 1rem; margin: 0 0 0.75rem; }
      input, button { width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; box-sizing: border-box; }
      ul { list-style: none; padding: 0; margin: 0.5rem 0; }
      li { display: flex; justify-content: space-between; padding: 0.25rem 0; font-size: 0.875rem; }
      .open { color: #15803d; }
      .blocked { color: #b91c1c; }
      .error { color: #b91c1c; font-weight: 600; }
      .muted { color: #6b7280; font-size: 0.75rem; }
      .window { font-size: 0.8125rem; font-weight: 600; margin: 0.5rem 0 0.125rem; }
      .error { color: #b91c1c; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <h1>EarnedTime</h1>
    <div id="signed-out" hidden>
      <input id="email" type="email" placeholder="email" autocomplete="username" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <button id="signin">Sign in</button>
      <p class="muted">Same account as the web app. There is no signup here.</p>
    </div>
    <div id="signed-in" hidden>
      <p class="muted" id="who"></p>
      <p class="window" id="window"></p>
      <p class="muted" id="window-note"></p>
      <ul id="sites"></ul>
      <p class="muted" id="checked"></p>
      <button id="refresh">Re-check now</button>
      <button id="signout">Sign out</button>
    </div>
    <p class="error" id="error"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
