<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked — EarnedTime</title>
    <style>
      /* The app's tokens (src/index.css), copied rather than imported: this
         page has no build step and must render before any script runs. */
      :root {
        --ink: #07090c;
        --panel: #11151b;
        --panel-hi: #191f27;
        --line: #252c37;
        --fg: #f2f5f9;
        --muted: #929cab;
        --faint: #5f6979;
        --acid: #c9f74e;
        --acid-deep: #93bf2a;
        --ember: #ff8a4c;
        --alert: #ff5757;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background-color: var(--ink);
        background-image: radial-gradient(
          120% 60% at 50% -10%,
          rgb(201 247 78 / 0.07) 0%,
          rgb(201 247 78 / 0) 60%
        );
        background-repeat: no-repeat;
        color: var(--fg);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 30rem;
        animation: fade-up 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      .shield {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 1rem;
        background: var(--panel-hi);
        color: var(--muted);
      }

      .shield.is-spend {
        color: var(--acid);
        background: rgb(201 247 78 / 0.12);
      }

      .eyebrow {
        margin: 1.25rem 0 0;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.75rem;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .lede {
        margin: 0.625rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.45;
        color: var(--muted);
      }

      /* --- balance --------------------------------------------------------- */
      .balance-row {
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .balance {
        font-size: 4.25rem;
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.9;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
      }

      .balance.is-spendable {
        color: var(--acid);
      }

      .balance-label {
        padding-bottom: 0.4rem;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.15;
        color: var(--muted);
      }

      /* --- session lengths ------------------------------------------------- */
      .lengths {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
        margin-top: 1.5rem;
      }

      .length {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.125rem;
        padding: 1rem 0;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        transition:
          transform 140ms cubic-bezier(0.2, 0.8, 0.3, 1),
          border-color 140ms ease,
          background-color 140ms ease;
      }

      .length:hover:not(:disabled) {
        border-color: var(--acid-deep);
      }

      .length:active:not(:disabled) {
        transform: scale(0.955);
        border-color: var(--acid);
        background: rgb(201 247 78 / 0.1);
      }

      .length:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .length .num {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }

      .length .unit {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--faint);
      }

      .hint {
        margin: 0.75rem 0 0;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: var(--faint);
      }

      /* --- locked slab ----------------------------------------------------- */
      .locked {
        margin-top: 1.5rem;
        padding: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--panel);
      }

      .locked .until {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .locked .why {
        margin: 0.375rem 0 0;
        font-size: 0.875rem;
        line-height: 1.45;
        color: var(--muted);
      }

      /* --- quote ----------------------------------------------------------- */
      blockquote {
        margin: 2rem 0 0;
        padding-left: 1rem;
        border-left: 2px solid var(--line);
      }

      blockquote p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        font-style: italic;
        color: var(--fg);
      }

      blockquote footer {
        margin-top: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--faint);
        font-style: normal;
      }

      /* --- footer bits ----------------------------------------------------- */
      .links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      a {
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        color: var(--fg);
      }

      .ghost {
        padding: 0.5rem 0.875rem;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }

      .ghost:hover {
        color: var(--fg);
        border-color: var(--faint);
      }

      .dest {
        margin-top: 1.5rem;
        font-size: 0.8125rem;
        color: var(--faint);
        word-break: break-all;
      }

      .muted {
        margin-top: 1.5rem;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--faint);
      }

      /* Failures get their own line so a routine diagnostics refresh a few
         seconds later cannot quietly erase them. */
      .alert {
        margin-top: 1.5rem;
        padding: 0.875rem 1rem;
        border: 1px solid rgb(255 87 87 / 0.3);
        border-radius: 1rem;
        background: rgb(255 87 87 / 0.12);
        color: #ffb0b0;
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .version {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: var(--faint);
      }

      [hidden] {
        display: none !important;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
        .length:active:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shield" id="shield" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
          <path
            d="M12 3l7 2.8v5.4c0 4.3-2.9 7.7-7 9.8-4.1-2.1-7-5.5-7-9.8V5.8L12 3z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <path
            d="M9 12.2h6"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <p class="eyebrow" id="window">—</p>
      <h1><span id="site">This site</span> is blocked</h1>
      <p class="lede" id="lede"></p>

      <div class="balance-row">
        <span class="balance" id="balance">—</span>
        <span class="balance-label" id="balance-label">minutes<br />available</span>
      </div>

      <!-- Spend window: the open IS the session start (spec section 3A). -->
      <div id="spend" hidden>
        <div class="lengths" id="lengths"></div>
        <p class="hint" id="spend-hint"></p>
      </div>

      <!-- Every other window: no buttons at all. -->
      <div class="locked" id="locked" hidden>
        <p class="until" id="locked-until"></p>
        <p class="why" id="locked-why"></p>
      </div>

      <blockquote id="quote" hidden>
        <p id="quote-text"></p>
        <footer id="quote-who"></footer>
      </blockquote>

      <p class="dest" id="destination" hidden></p>

      <div class="links">
        <a id="dashboard" href="#">Go to the dashboard →</a>
        <button class="ghost" id="retry">Check again</button>
      </div>

      <p class="alert" id="error" hidden></p>
      <p class="muted" id="note"></p>
      <p class="version">EarnedTime Blocker <span id="version"></span></p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
