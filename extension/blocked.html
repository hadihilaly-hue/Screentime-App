<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked — EarnedTime</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111827;
        color: #fff;
      }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font-size: 2rem; margin: 0 0 0.5rem; }
      .site { color: #fca5a5; }
      .balance { font-size: 4rem; font-weight: 700; margin: 1.5rem 0 0; }
      .label { color: #9ca3af; margin: 0; }
      a { color: #fff; }
      .muted { color: #9ca3af; font-size: 0.875rem; margin-top: 2rem; }
      .dest {
        color: #6b7280;
        font-size: 0.875rem;
        margin-top: 1.5rem;
        word-break: break-all;
      }
      button {
        font: inherit;
        padding: 0.5rem 0.75rem;
        background: transparent;
        color: #fff;
        border: 1px solid #4b5563;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="site" id="site">This site</span> is blocked</h1>
      <p class="label">Earn minutes, then start a session for it.</p>

      <p class="balance" id="balance">—</p>
      <p class="label" id="balance-label">minutes available</p>

      <p class="dest" id="destination" hidden></p>

      <p style="margin-top: 2rem">
        <a id="dashboard" href="#">Go to the dashboard →</a>
      </p>
      <p><button id="retry">I started a session — let me through</button></p>
      <p class="muted" id="note"></p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
