<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>EarnedTime</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount. Stays visible if the bundle throws first,
           which is what a production build with missing env vars does. -->
      <div style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        <h1 style="font-size: 1.25rem">EarnedTime failed to start</h1>
        <p>
          If this persists, the build is missing VITE_SUPABASE_URL or
          VITE_SUPABASE_ANON_KEY. Set both in your host's environment variables and
          redeploy. The browser console has the exact error.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
